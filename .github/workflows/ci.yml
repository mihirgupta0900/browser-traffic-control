name: Build and validate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.9'
      - run: swift build -c release
      - run: swift test
      - run: swift run -c release BrowserTrafficControlValidation
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/package-release.sh
      - name: Require signing configuration
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: test -n "$DEVELOPER_ID_CERTIFICATE_BASE64" && test -n "$MACOS_NOTARY_KEY_BASE64"
      - run: echo 'Signing/notarization implementation must be added by the maintainer before enabling public release uploads.' && exit 1
